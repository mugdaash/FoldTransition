name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract and build
        run: |
          unzip -q FoldTransition-PoC.zip
          gradle -p FoldTransition assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FoldTransition-APK
          path: FoldTransition/app/build/outputs/apk/debug/app-debug.apk
